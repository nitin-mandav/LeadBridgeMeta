<div class="shell">
  <aside class="sidebar">
    <div class="brand">LeadBridge<span>Meta</span></div>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Leads</a>
      <a routerLink="/connections" routerLinkActive="active">Connections</a>
      <a routerLink="/mappings" routerLinkActive="active">Field Mapping</a>
    </nav>
    <div class="user-box">
      <div class="user-email">{{ auth.currentUser()?.email }}</div>
      <button class="btn btn-secondary" (click)="logout()">Sign out</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
